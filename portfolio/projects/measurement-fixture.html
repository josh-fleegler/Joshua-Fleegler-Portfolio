<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>High-Precision Measurement Fixture — Joshua Fleegler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#1B1E22; --paper-raised:#232629; --line-faint:#2C2F33; --line-mid:#3A3D42;
    --ink:#EDEEE9; --ink-soft:#B7B9B4; --blue:#6E93C7; --blue-soft:#8FA9CB;
    --brass:#D2A868; --grey:#8B8D89;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'IBM Plex Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.6;
    background-image:linear-gradient(var(--line-faint) 1px, transparent 1px), linear-gradient(90deg, var(--line-faint) 1px, transparent 1px);
    background-size:40px 40px; background-position:-1px -1px;
  }
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--blue); outline-offset:3px;}
  .wrap{max-width:900px; margin:0 auto; padding:0 28px;}
  header.sheet-bar{
    position:sticky; top:0; z-index:50; background:rgba(27,30,34,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line-mid);
  }
  .sheet-bar-inner{display:flex; align-items:center; justify-content:space-between; padding:14px 0; font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);}
  .mark{color:var(--blue); font-weight:600;}
  nav a{text-decoration:none; color:var(--ink-soft); border-bottom:1px solid transparent; padding-bottom:2px;}
  nav a:hover{color:var(--blue); border-color:var(--blue);}

  main{padding:64px 0 100px;}
  .part-no{font-family:var(--mono); font-size:12px; color:var(--blue); display:block; margin-bottom:14px;}
  h1{font-family:var(--mono); font-weight:700; font-size:clamp(28px,4vw,42px); text-transform:uppercase; line-height:1.1; margin-bottom:10px;}
  .category-tag{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:36px; display:block;}

  .hero-image{border:1px solid var(--line-mid); background:var(--paper-raised); margin-bottom:36px; overflow:hidden;}
  .hero-image img{width:100%; display:block;}

  p.lead{font-size:17px; color:var(--ink-soft); max-width:60ch; margin-bottom:20px;}
  .coming-soon{
    margin-top:36px; padding:16px 20px; border:1px dashed var(--line-mid);
    font-family:var(--mono); font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--grey);
  }
</style>
</head>
<body>

<header class="sheet-bar">
  <div class="wrap sheet-bar-inner">
    <div><span class="mark">JF</span> &nbsp;Portfolio</div>
    <nav><a href="../index.html">← Back to projects</a></nav>
  </div>
</header>

<main class="wrap">
  <span class="part-no">No. 002</span>
  <span class="category-tag">Professional / Industry Work</span>
  <h1>High-Precision Measurement Fixture</h1>

  <div class="hero-image">
    <img src="../assets/measurement-fixture.png" alt="CAD render of a high-precision measurement fixture">
  </div>

  <p class="lead">A fixture designed to hold tight-tolerance parts steady for repeatable micrometer measurement.</p>

  <div class="coming-soon">Full write-up coming soon</div>
</main>

</body>
</html>
